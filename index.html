html+=`<section class="pg" id="c" style="background-image:url(${D.catbg})"><div class="stage" id="stage"><div class="lbl" id="lbl"></div></div><div class="navw"><img class="abs" src="${D.navimg}" style="${box(D.navbox[0],D.navbox[1],D.navbox[2],D.navbox[3],CH)}" alt="">${(()=>{const nb=D.navbox;return navH(1,CH,[[nb[2]-nb[0],nb[3]-nb[1],nb[0],nb[1]],[PW,CH,0,0]])})()}</div></section>`;
// namo
const nm=D.namo,dl=D.doll;
html+=`<section class="pg" id="n"><div class="bgf"></div><div class="cv"><img class="f" src="${D.namobase}" alt="NAMO"><img class="abs doll" id="doll" src="${D.dollimg}" style="${box(dl[0],dl[1],dl[2],dl[3],CH)}" alt="">${hot(nm.doll[0],nm.doll[1],nm.doll[2],nm.doll[3],CH,'#/','Inicio',' id="dh" style="'+box(nm.doll[0],nm.doll[1],nm.doll[2],nm.doll[3],CH)+'"')}<a class="h" href="https://www.instagram.com/namohaus" target="_blank" rel="noopener" title="@namohaus" style="${box(nm.ig[0],nm.ig[1],nm.ig[2],nm.ig[3],CH)}"></a></div></section>`;
app.innerHTML=html;
// fix: hot() with id/extra produced duplicate style attr; rebuild dh
(function(){const a=document.getElementById('dh');const d=document.getElementById('doll');const on=()=>d.classList.add('x'),off=()=>d.classList.remove('x');
 a.addEventListener('mouseenter',on);a.addEventListener('mouseleave',off);a.addEventListener('touchstart',()=>{on();setTimeout(off,1600)},{passive:true})})();

(function(){
 const sec=document.getElementById('c'),st=document.getElementById('stage'),lbl=document.getElementById('lbl'),N=D.icons.length,STEP=2*Math.PI/N,REF=123;
 const els=D.icons.map((r,i)=>{const a=document.createElement('a');a.className='ic';a.href='#/p/'+PR[i];a.title=NAMES[i];a.setAttribute('aria-label',NAMES[i]);a.dataset.i=i;
  const im=new Image();im.src=D.icon[i];im.alt='';im.draggable=false;a.appendChild(im);st.appendChild(a);return a});
 let W=1,Hh=1,f=1,R=1,rot=0,anim=0;const mod=(a,n)=>((a%n)+n)%n;
 function size(){const b=st.getBoundingClientRect();if(!b.width)return;W=b.width;Hh=b.height;
  const por=W<Hh;f=(por?W*.15:Math.min(W*.2,Hh*.14))/REF;R=por?W*.64:Math.min(W*.46,Hh*1.1);
  els.forEach((a,i)=>{const r=D.icons[i];a.style.width=(r[2]-r[0])*f+'px';a.style.height=(r[3]-r[1])*f+'px'});render()}
 function render(){const y0=Hh*(W<Hh?.5:.6);
  els.forEach((a,i)=>{const th=(i-rot)*STEP,s=Math.sin(th),c=Math.cos(th),t=(c+1)/2;
   const sc=2.3*(.28+.72*Math.pow(t,3.2)),op=.1+.9*Math.pow(t,2.1);
   const x=W/2+s*R,y=y0-(1-c)/2*Hh*.17;
   a.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,-50%) rotateY(${(-s*30).toFixed(1)}deg) scale(${sc.toFixed(3)})`;
   a.style.opacity=op.toFixed(3);a.style.zIndex=Math.round(c*100)+100;a.style.pointerEvents=c>-.35?'auto':'none';a.classList.toggle('active',c>.92)});
  const cur=mod(Math.round(rot),N),r=D.icons[cur];lbl.textContent=NAMES[cur];lbl.style.top=(y0+(r[3]-r[1])*f*2.3/2+Math.min(40,Hh*.05))+'px'}
 const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
 function go(b){cancelAnimationFrame(anim);const a=rot,t0=performance.now(),red=matchMedia('(prefers-reduced-motion:reduce)').matches,dur=red?1:500+220*Math.min(Math.abs(b-a),3);
  (function tick(now){const p=Math.min(1,(now-t0)/dur);rot=a+(b-a)*ease(p);render();if(p<1)anim=requestAnimationFrame(tick);else rot=b})(t0)}
 const target=()=>Math.round(rot);
 let down=null,moved=false,sup=false,lastR=0,lastT=0,vel=0;
 st.addEventListener('pointerdown',e=>{if(e.button>0)return;cancelAnimationFrame(anim);down={x:e.clientX,r0:rot};moved=false;lastR=rot;lastT=performance.now();vel=0});
 addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x;if(!moved&&Math.abs(dx)>6){moved=true;st.classList.add('drag')}
  if(moved){rot=down.r0-dx/(W*.2);const n=performance.now();if(n>lastT){vel=.8*vel+.2*((rot-lastR)/(n-lastT));lastR=rot;lastT=n}render()}});
 function end(){if(!down)return;down=null;st.classList.remove('drag');if(moved){sup=true;setTimeout(()=>sup=false,0);const base=Math.round(rot);go(Math.max(base-2,Math.min(base+2,Math.round(rot+vel*220))))}}
 addEventListener('pointerup',end);addEventListener('pointercancel',end);
 st.addEventListener('click',e=>{if(sup){e.preventDefault();e.stopPropagation();return}const a=e.target.closest('.ic');if(!a)return;const i=+a.dataset.i;
  if(i!==mod(Math.round(rot),N)){e.preventDefault();let d=mod(i-rot,N);if(d>N/2)d-=N;go(rot+d)}},true);
 let wl=0;st.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>8){e.preventDefault();const n=performance.now();if(n-wl>380){wl=n;go(target()+(e.deltaX>0?1:-1))}}},{passive:false});
 addEventListener('keydown',e=>{if(!sec.classList.contains('on'))return;if(e.key=='ArrowRight')go(target()+1);else if(e.key=='ArrowLeft')go(target()-1)});
 new ResizeObserver(size).observe(st);size();
})();
// carga perezosa de la imagen fuente para el efecto hover de los tabs
function prime(sec){if(!sec||sec.dataset.p)return;sec.dataset.p=1;
  if(sec.id=='c'){sec.style.setProperty('--nv','url('+D.navimg+')');sec.style.setProperty('--sv','url('+D.catbg+')')}
  else{const im=sec.querySelector('img.f');if(im)sec.style.setProperty('--sv','url('+im.src+')')}}
prime(document.getElementById('s'));prime(document.getElementById('n'));
app.addEventListener('pointerover',e=>{if(e.target.closest)prime(e.target.closest('.pg'))});
app.addEventListener('focusin',e=>prime(e.target.closest('.pg')));
const bc=document.getElementById('bc');
function crumbs(id){
  const c=[['Inicio','#/']];
  if(id=='h')c.push(['Home']);else if(id=='c')c.push(['Catalog']);else if(id=='n')c.push(['NaMo']);
  else if(id.startsWith('p-')){c.push(['Catalog','#/catalog']);c.push([NAMES[PR.indexOf(id.slice(2))]])}
  bc.hidden=id=='s';if(id=='s')return;
  bc.replaceChildren();
  c.forEach((x,i)=>{if(i){const sp=document.createElement('i');sp.textContent='›';sp.setAttribute('aria-hidden','true');bc.appendChild(sp)}
    const el=document.createElement(x[1]?'a':'span');el.textContent=x[0];if(x[1])el.href=x[1];else el.setAttribute('aria-current','page');bc.appendChild(el)});
  bc.classList.remove('in');void bc.offsetWidth;bc.classList.add('in')}
let cur=null;
function swap(id){document.querySelectorAll('.pg').forEach(e=>e.classList.toggle('on',e.id==id));scrollTo(0,0);crumbs(id);cur=id;
  document.documentElement.classList.toggle('red',id=='s'||id=='c'||id=='n');document.documentElement.classList.toggle('land',id=='s');
  const t=id=='h'?'#/home':id=='n'?'#/namo':(id=='c'||id.startsWith('p-'))?'#/catalog':'';
  document.querySelectorAll('#tb a').forEach(a=>a.getAttribute('href')==t?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'))}
function show(id){
  if(cur===null||id===cur||matchMedia('(prefers-reduced-motion:reduce)').matches){swap(id);return}
  if(document.startViewTransition){document.startViewTransition(()=>swap(id));return}
  app.classList.add('out');setTimeout(()=>{swap(id);app.classList.remove('out')},220)}
function route(){const h=location.hash.replace(/^#\/?/,'').split('/'),r=h[0];
 if(r=='home')show('h');else if(r=='catalog')show('c');else if(r=='namo')show('n');else if(r=='p'&&PG[h[1]])show('p-'+h[1]);else show('s')}
// al abrir el link siempre se empieza en la portada
if('scrollRestoration' in history)history.scrollRestoration='manual';
if(location.hash&&!/^#\/?$/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);
addEventListener('hashchange',route);route();

(function(){
const DT={"beanA": "img/beanA.jpg", "beanB": "img/beanB.jpg", "barB": "img/barB.png", "lampA": "img/lampA.png", "barL": "img/barL.png"},CF={"bean": {"PH": 4492.0, "top": 2848.4, "bar": [196, 4225, 1722, 4470]}, "lamp": {"PH": 4641.0, "top": 2482.2, "box": [824.4887522705045, 2588.863658340048, 1598.0293419030322, 4449.680741337631], "bar": [110.0, 4390.0, 1920.0, 4609.0], "split": 962.081947743468, "bottom": 4453.158904109589}},PW=1920;
function place(el,x0,y0,x1,y1,T,H){el.style.left=(x0/PW*100)+'%';el.style.width=((x1-x0)/PW*100)+'%';el.style.top=((y0-T)/H*100)+'%';el.style.height=((y1-y0)/H*100)+'%'}
function img(src){const i=new Image();i.src=src;i.alt='';i.draggable=false;return i}
function build(sec,top,H,layers,opt){
  const c=document.createElement('div');c.className='sl';c.style.top=(top/opt.PH*100)+'%';c.style.height=(H/opt.PH*100)+'%';
  const T=top;layers(c,T,H);
  const hd=document.createElement('div');hd.className='hd';hd.innerHTML='<i></i><b>‹›</b>';hd.style.height=(opt.lineH||100)+'%';c.appendChild(hd);
  let clipEl=c.querySelector('.clip');
  function set(p){p=Math.max(opt.min,Math.min(opt.max==null?100:opt.max,p));hd.style.left=p+'%';opt.apply(c,p)}
  let on=false;
  const px=e=>{const r=c.getBoundingClientRect();return (e.clientX-r.left)/r.width*100};
  c.addEventListener('pointerdown',e=>{if(e.button>0)return;on=true;c.classList.add('act');c.setPointerCapture(e.pointerId);set(px(e))});
  c.addEventListener('pointermove',e=>{if(on)set(px(e))});
  const end=e=>{on=false;c.classList.remove('act')};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  sec.appendChild(c);set(opt.p0);return c}
// ---- BEAN
(function(){const s=document.getElementById('p-bean');if(!s)return;const C=CF.bean,PH=C.PH,T=C.top,H=PH-T;
 build(s,T,H,(c)=>{
  const a=img(DT.beanA);a.className='fill';c.appendChild(a);
  const w=document.createElement('div');w.className='clip';const b=img(DT.beanB);b.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%';w.appendChild(b);c.appendChild(w);
  const r=C.bar,i=img(DT.barB);i.style.position='absolute';place(i,r[0],r[1],r[2],r[3],T,H);c.appendChild(i);
 },{PH,p0:50,min:2,max:98,apply:(c,p)=>{c.querySelector('.clip').style.clipPath='inset(0 '+(100-p)+'% 0 0)'}});
})();
// ---- LAMPARA
(function(){const s=document.getElementById('p-lampara');if(!s)return;const C=CF.lamp,PH=C.PH,T=C.top,H=PH-T,sp=C.split/PW*100;
 build(s,T,H,(c)=>{
  const w=document.createElement('div');w.className='clip';const b=C.box,i=img(DT.lampA);i.style.position='absolute';place(i,b[0],b[1],b[2],b[3],T,H);w.appendChild(i);c.appendChild(w);
  const r=C.bar,j=img(DT.barL);j.style.position='absolute';place(j,r[0],r[1],r[2],r[3],T,H);c.appendChild(j);
 },{PH,p0:sp,min:sp,max:88,lineH:(C.bottom-T)/H*100,apply:(c,p)=>{c.querySelector('.clip').style.clipPath='inset(0 '+(100-p)+'% 0 0)'}});
})();
})();
